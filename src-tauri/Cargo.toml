[package]
name = "vaultkey"
version = "0.1.0"
description = "Offline encrypted credential vault"
edition = "2021"
rust-version = "1.85"

[lib]
name = "vaultkey_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
arboard = { version = "3", default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
